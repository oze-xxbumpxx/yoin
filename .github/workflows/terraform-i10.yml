name: Terraform I10

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  i10:
    name: Offline environment plans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false
      - run: bash infra/terraform/tests/check-i10.sh
