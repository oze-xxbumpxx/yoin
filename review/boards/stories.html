<title>yoin ストーリーボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 左にタブのレール、右に1件ずつの詳しい面。文脈ごとの色で、画面・API・ストーリーの対応をたどれるようにする */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --ink:#1b1f2c; --muted:#5d6376; --line:#d8dbe4; --soft:#e9ebf1;
  --accent:#2d3f8e;
  --c-group:#4a5ca6; --c-catalog:#23806f; --c-attendance:#b9532f; --c-ticket:#a87a14; --c-merch:#86479b; --c-notification:#2f7fa8; --c-none:#6b7080;
  --m-get:#23806f; --m-post:#2d58b8; --m-put:#a8700f; --m-patch:#7c4aa0; --m-delete:#b8413a;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a; --surface:#1a1d27; --ink:#e7e9f0; --muted:#9ba1b4; --line:#2d313f; --soft:#232735;
  --accent:#9fb0f2;
  --c-group:#8f9ff0; --c-catalog:#5cc7b2; --c-attendance:#f08a63; --c-ticket:#e0b04a; --c-merch:#c690dc; --c-notification:#6cc0ea; --c-none:#9ba1b4;
  --m-get:#5cc7b2; --m-post:#86a6f5; --m-put:#e3ad4e; --m-patch:#bf98e0; --m-delete:#f08a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131a; --surface:#1a1d27; --ink:#e7e9f0; --muted:#9ba1b4; --line:#2d313f; --soft:#232735;
  --accent:#9fb0f2;
  --c-group:#8f9ff0; --c-catalog:#5cc7b2; --c-attendance:#f08a63; --c-ticket:#e0b04a; --c-merch:#c690dc; --c-notification:#6cc0ea; --c-none:#9ba1b4;
  --m-get:#5cc7b2; --m-post:#86a6f5; --m-put:#e3ad4e; --m-patch:#bf98e0; --m-delete:#f08a82; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.75;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:.05em .35em;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 18px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--display);font-size:clamp(26px,4vw,36px);line-height:1.25;margin:0;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
nav.boards{display:flex;gap:6px;flex-wrap:wrap}
nav.boards a,nav.boards span{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;background:var(--surface)}
nav.boards span.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;padding-top:22px;align-items:start}
.rail{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.rail input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.rail h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:6px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--c-none));flex:none}
.tab{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1.45}
.tab:hover{background:var(--soft)}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--cc,var(--accent)),0 0 0 1px var(--line)}
.tab .tid{font-family:var(--mono);font-size:11.5px;color:var(--cc,var(--muted));flex:none;min-width:3.6em}
.tab .tname{min-width:0}
.rail .toggle{display:none}
main{min-width:0}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;margin-bottom:6px}
.head .bid{font-family:var(--mono);font-size:14px;color:var(--cc);border:1px solid var(--cc);padding:1px 8px;border-radius:5px}
.head h2{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);margin:0;line-height:1.3;text-wrap:balance}
.ctxlabel{font-size:13px;color:var(--cc);display:inline-flex;gap:6px;align-items:center}
.lead{color:var(--muted);margin:0 0 20px;max-width:70ch}
section.blk{margin-top:26px}
section.blk>h4{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:baseline}
section.blk>h4 .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
/* phone mock */
.phone{border:1.5px solid var(--line);border-radius:30px;padding:12px 10px 18px;background:var(--surface);max-width:300px;width:100%}
.phone .notch{width:70px;height:6px;border-radius:6px;background:var(--line);margin:2px auto 12px}
.phone .bar{display:flex;align-items:center;gap:8px;padding:0 6px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.phone .bar svg{flex:none}
.phone ul{list-style:none;margin:12px 0 0;padding:0 4px;display:grid;gap:8px}
.phone li{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55;border-left:3px solid var(--cc)}
.phone .cap{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
/* api cards */
.apis{display:grid;gap:8px}
.api{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.api summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;align-items:baseline}
.api summary::-webkit-details-marker{display:none}
.api .nm{font-weight:700;font-size:14.5px}
.api .rt{grid-column:2;font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.api .body{padding:0 12px 12px 12px;border-top:1px dashed var(--line);font-size:14px}
.api .body p{margin:10px 0 0}
.api .ctxbar{width:4px;align-self:stretch;border-radius:3px;background:var(--cc);grid-row:span 2}
.methods{display:inline-flex;gap:4px;flex-wrap:wrap}
.m{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;color:var(--surface);background:var(--mc)}
.m.GET{--mc:var(--m-get)}.m.POST{--mc:var(--m-post)}.m.PUT{--mc:var(--m-put)}.m.PATCH{--mc:var(--m-patch)}.m.DELETE{--mc:var(--m-delete)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip:hover{border-color:var(--cc,var(--accent))}
.chip b{font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--cc,var(--muted))}
.ext{font-size:12px;margin-left:6px}
.empty{color:var(--muted);font-size:14px}
/* mini flow */
.mini{overflow-x:auto}
.mini svg{display:block;max-width:none}
.node rect{fill:var(--surface);stroke:var(--line)}
.node text{fill:var(--ink);font-size:12.5px;font-family:var(--body)}
.node .nid{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
.node.cur rect{fill:var(--ink);stroke:var(--ink)}
.node.cur text,.node.cur .nid{fill:var(--bg)}
.node.link{cursor:pointer}
.node.link:hover rect{stroke:var(--accent)}
.node.dim{opacity:.35}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2}
.edge.dot{stroke-dasharray:4 4}
.edge.hi{stroke:var(--accent);stroke-width:2}
/* story */
.quote{font-family:var(--display);font-size:clamp(18px,2.3vw,21px);line-height:1.7;margin:4px 0 0;padding:14px 18px;border-left:4px solid var(--cc);background:var(--surface);border-radius:0 10px 10px 0;max-width:62ch}
.ac{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-width:72ch}
.ac li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px}
.ac li svg{margin-top:5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left}
.thumb:hover{border-color:var(--accent)}
.thumb .tt{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline}
.thumb .tt b{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:600}
.thumb p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
/* overview */
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:6px 0 4px}
.stat{display:flex;gap:8px;align-items:baseline}
.stat .v{font-family:var(--display);font-size:30px;line-height:1}
.stat .k{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:6px;max-width:560px}
.barrow a{text-decoration:none;color:var(--ink)}.barrow a:hover{color:var(--accent)}
.barrow{display:grid;grid-template-columns:12em minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;border-radius:5px;background:var(--soft)}
.barrow .fill{height:100%;border-radius:5px;background:var(--cc)}
.barrow .num{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:12.5px;background:var(--soft)}
tr:last-child td{border-bottom:0}
.matrix th,.matrix td{padding:0;border:1px solid var(--line);text-align:center;font-size:11px}
.matrix th.rowh{text-align:left;padding:3px 8px;white-space:nowrap;font-family:var(--mono);background:var(--surface);position:sticky;left:0;z-index:1}
.matrix th.colh{writing-mode:vertical-rl;padding:6px 2px;font-family:var(--mono);font-weight:600;height:56px;cursor:pointer}
.matrix td{width:24px;height:22px}
.matrix td.on{background:var(--cc)}
.matrix tr:hover th.rowh{color:var(--accent)}
.matrix th.rowh button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.md p{margin:0 0 10px;max-width:72ch}
.md ul{margin:0 0 10px;padding-left:1.2em;max-width:76ch}
.md li{margin:3px 0}
.md h5{font-size:16px;margin:22px 0 8px;font-family:var(--display)}
.md pre{background:var(--soft);padding:10px 12px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:12.5px}
.md .scroll{margin-bottom:12px}
.box{border:1px solid var(--line);border-left:4px solid var(--cc,var(--accent));border-radius:8px;padding:12px 14px;background:var(--surface);font-size:14px;max-width:80ch}
.box p{margin:0 0 6px}
.err{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.err i{font-style:normal;color:var(--muted)}
.sentences{display:grid;gap:6px;margin:0;padding:0;list-style:none;max-width:76ch}
.sentences li{padding-left:14px;position:relative;font-size:14.5px}
.sentences li::before{content:"";position:absolute;left:0;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--cc)}
.route{font-family:var(--mono);font-size:clamp(14px,1.8vw,17px);padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:nowrap}
.route .p{color:var(--cc);font-weight:600}
.route .q{color:var(--muted)}
.route .line{display:flex;gap:12px;align-items:center}
.route .line+.line{margin-top:6px}
.src{font-size:12px;color:var(--muted);margin-top:36px;border-top:1px solid var(--line);padding-top:10px}

/* wireframe */
.phone.wf{padding:10px 10px 14px;max-width:300px}
.wf .scr{display:grid;gap:7px;font-size:12.5px;line-height:1.45}
.wf .scr>*{position:relative}
.wf .pin{position:absolute;right:-16px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;padding:0;box-shadow:0 0 0 2px var(--surface)}
.wf .pin+.pin{right:-38px}
.wf .scr .pin.m{color:var(--surface);font-size:10.5px;font-family:var(--mono);margin:0}
.wf .hl{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.w-logo{font-family:var(--display);font-size:26px;text-align:center;padding:14px 0 8px}
.w-title{font-weight:700;font-size:16px;padding:2px 2px 4px}
.w-back{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;padding:0 2px 7px;border-bottom:1px solid var(--line)}
.w-back span{font-size:18px;line-height:1;color:var(--muted)}.w-back em{margin-left:auto;font-style:normal;font-weight:400;font-size:11px;color:var(--muted);background:var(--soft);padding:1px 7px;border-radius:9px}
.w-hero{background:var(--soft);border-radius:10px;padding:12px;display:grid;gap:2px}.w-hero b{font-family:var(--display);font-size:16px}.w-hero span{color:var(--muted)}
.w-in label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
.w-in>div{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--bg)}
.w-in .sel{display:flex;justify-content:space-between;gap:6px}.w-in .sel i{font-style:normal;color:var(--muted)}
.w-btn{text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px;font-weight:700}
.w-btn.pri{background:var(--cc);border-color:var(--cc);color:var(--surface)}
.w-btn.dng{color:var(--m-delete);border-color:var(--m-delete)}
.w-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.w-link{color:var(--accent);font-size:12px;text-align:center}
.w-note{font-size:11px;color:var(--muted)}
.w-warn{font-size:11.5px;background:color-mix(in srgb,var(--c-ticket) 16%,transparent);border:1px solid color-mix(in srgb,var(--c-ticket) 45%,transparent);border-radius:7px;padding:6px 8px}
.w-sec{font-size:11px;font-weight:700;color:var(--muted);padding-top:4px;letter-spacing:.04em}
.w-row{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 2px 6px}
.w-row>div{flex:1;min-width:0;display:grid}.w-row b{font-weight:500}.w-row span{font-size:11px;color:var(--muted)}
.w-row em{font-style:normal;font-size:11.5px;color:var(--muted);text-align:right}
.w-row.todo i{font-style:normal;font-size:10.5px;background:var(--cc);color:var(--surface);padding:1px 6px;border-radius:5px}
.st{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--soft);color:var(--ink)}
.st.won{background:color-mix(in srgb,var(--m-get) 22%,transparent)}.st.lost{background:color-mix(in srgb,var(--m-delete) 18%,transparent)}
.w-tabs{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:3px}.w-tabs span{flex:1;text-align:center;padding:4px;border-radius:6px;font-size:11.5px;color:var(--muted)}.w-tabs span.on{background:var(--surface);color:var(--ink);font-weight:700}
.w-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}.w-kv span{color:var(--muted)}.w-kv b{font-weight:500}
.w-av{display:flex;align-items:center;gap:0}.w-av i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:var(--surface);font-size:11px;margin-right:-6px;box-shadow:0 0 0 2px var(--surface)}.w-av span{margin-left:14px;font-size:11.5px;color:var(--muted)}
.w-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.w-chips label{width:100%;font-size:10.5px;color:var(--muted)}.w-chips i{font-style:normal;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11.5px}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.w-grid span{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:11.5px}
.w-step,.w-song{display:flex;gap:9px;align-items:center}.w-step i,.w-song i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:11px;font-weight:700}
.w-step>div,.w-song>div{display:grid;flex:1}.w-step span,.w-song span{font-size:11px;color:var(--muted)}.w-song em{font-style:normal;color:var(--muted)}
.w-status{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.w-status span{font-size:10px;text-align:center;padding:5px 2px;border-radius:5px;background:var(--soft);color:var(--muted)}
.w-status span.done{background:color-mix(in srgb,var(--cc) 30%,transparent);color:var(--ink)}.w-status span.on{background:var(--cc);color:var(--surface);font-weight:700}
.w-photo{border:1.5px dashed var(--line);border-radius:10px;height:84px;display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);font-size:11.5px}
.w-item{display:flex;gap:9px;border:1px solid var(--line);border-radius:9px;padding:7px}.w-item .ph{width:44px;height:44px;border-radius:7px;background:var(--soft);flex:none}.w-item>div{display:grid}.w-item span{font-size:11px;color:var(--muted)}.w-item .req{color:var(--ink)}.w-item u{text-decoration:none;color:var(--accent)}
.w-total{display:flex;justify-content:space-between;font-size:12.5px;padding:2px}.w-total b{font-variant-numeric:tabular-nums}
.w-bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:11.5px}.w-bars div{height:8px;background:var(--soft);border-radius:4px}.w-bars i{display:block;height:100%;background:var(--cc);border-radius:4px}
.w-prev{border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:grid;background:var(--bg)}.w-prev b{font-size:11.5px}.w-prev span{font-size:11px;color:var(--muted)}
.w-fab{justify-self:end;width:34px;height:34px;border-radius:50%;background:var(--cc);color:var(--surface);display:grid;place-items:center;font-size:18px}
.w-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}.w-nav span{text-align:center;font-size:10.5px;color:var(--muted)}.w-nav span.on{color:var(--cc);font-weight:700}
.wf.sm{max-width:220px;border-radius:22px;padding:8px 8px 10px;pointer-events:none}
.wf.sm .scr{font-size:10.5px;gap:5px}.wf.sm .w-title,.wf.sm .w-back{font-size:12px}.wf.sm .w-logo{font-size:20px;padding:6px 0 2px}
.wf.sm .w-hero b{font-size:13px}.wf.sm .pin{display:none}
.cap2{font-size:12px;color:var(--muted);max-width:300px;margin:8px 0 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px 14px}
.wfcell{display:grid;gap:6px;align-content:start;text-decoration:none;color:inherit}
.wfcell:hover .phone{border-color:var(--accent)}
.wfcap{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink)}.wfcap b{font-family:var(--mono);font-size:11.5px;color:var(--muted)}.wfcap .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}

", "ctx": "merch", "name": "品目の下書き一覧", "route": "`GET /groups/{g}/merch-drafts`", "rule": "自分が作った下書きだけ。下書きごとに、品名、価格、属する先、`imageUrl`", "screens": ["S-15"], "stories": []}, {"id": "merch-04", "ctx": "merch", "name": "品目の下書きを確定する", "route": "`POST /groups/{g}/merch-drafts/{draftId}/confirm`", "rule": "本文は`{ itemId }`。画像を`items/`の下にコピーし、品目を作って下書きを消す。下書きがもう無くても、`itemId`の品目がこのグループにあれば同じ応答を返す。公演の下書きと同じく、別の下書きから作った品目と区別しないことは受け入れる", "screens": ["S-14"], "stories": ["M-01"]}, {"id": "merch-05", "ctx": "merch", "name": "品目を直す・消す", "route": "`PATCH`・`DELETE /groups/{g}/merch-items/{itemId}`", "rule": "写真を替えるときも一時置き場のキーで送り、前の画像のキーは消す予定の表に入れる。品目を消すと画像も消す予定の表に入る", "screens": ["S-15"], "stories": []}, {"id": "merch-06", "ctx": "merch", "name": "グッズリストを見る", "route": "`GET /groups/{g}/concerts/{concertId}/merch-list`", "rule": "載せられる品目（公演の品目と、公演のツアーの品目）と`imageUrl`。品目ごとに、購入担当と印、メンバーごとの欲しい数", "screens": ["S-15"], "stories": ["M-02"]}, {"id": "merch-07", "ctx": "merch", "name": "欲しい数を入れる・消す", "route": "`PUT`・`DELETE /groups/{g}/concerts/{concertId}/merch-list/requests/{itemId}`", "rule": "本文は`{ quantity }`（1以上）。自分の分だけ。品目は、その公演かツアーのものだけ。グッズリストの行は最初の書き込みで作る", "screens": ["S-15"], "stories": ["M-02"]}, {"id": "merch-08", "ctx": "merch", "name": "購入担当を決める・外す", "route": "`PUT`・`DELETE /groups/{g}/concerts/{concertId}/merch-list/buyers/{itemId}`", "rule": "本文は`{ userId }`。担当は同じグループの有効なメンバー。同行者と同じく、担当にする人の`users`と`members`の行もロックして`active`かを確かめる（抜けている途中の人は担当にできない）。担当を別の人に替えたら印は消える", "screens": ["S-15"], "stories": ["M-03"]}, {"id": "merch-09", "ctx": "merch", "name": "印を付ける", "route": "`PUT /groups/{g}/concerts/{concertId}/merch-list/buyers/{itemId}/purchase-status`", "rule": "本文は`{ purchaseStatus }`（`bought`・`sold_out`・`null`）。その品目の購入担当だけ。担当のいない品目は`not_found`", "screens": ["S-16"], "stories": ["M-06"]}, {"id": "merch-10", "ctx": "merch", "name": "自分が買う物", "route": "`GET /groups/{g}/concerts/{concertId}/merch-list/my-purchases`", "rule": "自分が購入担当の品目、数、頼んだ人ごとの数、合計金額、売り切れを除いた合計金額、価格の無い品目があるか。頼んだ人は表示名で返す", "screens": ["S-16"], "stories": ["M-04"]}, {"id": "merch-11", "ctx": "merch", "name": "自分が頼んだ物", "route": "`GET /groups/{g}/concerts/{concertId}/merch-list/my-requests`", "rule": "自分が欲しい数を入れた品目ごとに、数、購入担当（表示名）、金額、印", "screens": ["S-17"], "stories": ["M-05"]}, {"id": "notification-01", "ctx": "notification", "name": "通知先一覧", "route": "`GET /me/push-subscriptions`", "rule": "端末ごとに、名前（登録したときのブラウザと端末の種類から作る。例「iPhone Safari」）、登録日時、最後に送れなかった日時、`endpoint`。画面は自分の購読の`endpoint`と比べて「この端末」を出す", "screens": ["S-05", "S-23"], "stories": ["N-02", "N-04"]}, {"id": "notification-02", "ctx": "notification", "name": "通知先を登録する", "route": "`POST /me/push-subscriptions`", "rule": "本文はブラウザの`PushSubscription`の`endpoint`と鍵。同じ`endpoint`がすでに自分のものなら同じ行を返す。別の人のものなら`already_exists`で断り、その人の行は変えない。画面は購読を取り消してやり直し（新しい`endpoint`になる）、もう一度登録する。1台の端末を2人で使い回すときもこれで足りる（2026-11-21、大関さんが決定）", "screens": ["S-03", "S-23"], "stories": ["N-01"]}, {"id": "notification-03", "ctx": "notification", "name": "通知先を外す", "route": "`DELETE /me/push-subscriptions/{subscriptionId}`", "rule": "本人だけ。ほかの人の通知先のIDは、無いときと同じ204にする（`/me`の下では他人の行を無いものとして扱う）。まだ送っていないリマインドは、ほかの端末に送る", "screens": ["S-23"], "stories": ["N-04"]}], "stories": [{"id": "G-01", "title": "招待リンクから参加する", "ctx": "group", "text": "招待された人として、招待リンクから最小限の登録でグループに参加したい。アプリの設定に時間をかけずに、仲間の公演情報を見られるようにするため。", "ac": ["有効期限を過ぎたリンク、利用回数の上限に達したリンク、解散を始めたグループのリンクでは参加できない。", "登録すると、ユーザーと、そのグループのメンバーと、本人の自分用グループができる。", "招待リンクを通らずにログインしただけでは、ユーザーは作られない。", "すでに登録しているユーザーがリンクを開いたら、登録はせずにメンバーにだけ加える。"], "screens": ["S-02", "S-03"], "apis": ["group-03", "group-04"], "apiRef": "招待を見る、招待から参加する"}, {"id": "G-02", "title": "招待リンクを発行する", "ctx": "group", "text": "オーナーとして、有効期限と利用回数の上限を付けた招待リンクを発行したい。リンクが意図しない人に渡っても、参加できる人を限るため。", "ac": ["発行できるのはオーナーだけ。", "自分用グループでは発行できない。"], "screens": ["S-21"], "apis": ["group-08"], "apiRef": "招待リンクを発行する"}, {"id": "G-03", "title": "仲間と使うグループを作る", "ctx": "group", "text": "メンバーとして、仲間と使うグループを新しく作りたい。いつもと違う仲間とも公演を共有するため。", "ac": ["作った人がオーナーになる。", "新しい人を入れるには招待リンクが要る。"], "screens": ["S-04"], "apis": ["group-05"], "apiRef": "グループを作る"}, {"id": "G-04", "title": "自分のグループを切り替える", "ctx": "group", "text": "ユーザーとして、自分が入っているグループの一覧から、見るグループを選びたい。グループごとに公演と準備を分けて見るため。", "ac": ["自分用グループは「自分用」として、仲間と使うグループと分けて見せる。"], "screens": ["S-04"], "apis": ["group-02"], "apiRef": "自分のグループ一覧"}, {"id": "G-05", "title": "退会する", "ctx": "group", "text": "ユーザーとして、yoinを退会したい。使わなくなったら、自分だけのデータを残さないため。", "ac": ["退会を受け付けたら「退会を受け付けました」と出し、すぐにサインアウトさせる。そのあとの操作はできない。", "消えるもの：アカウント、参戦と参戦記録と公演の写し、本人が申込者のチケット申込、頼まれ物、下書き、通知の予約と通知先、自分用グループ。", "残るもの：公演、セトリ、確定した品目と画像など、グループの全員のデータ。", "ほかの人の参戦記録で本人が同行者になっていたら、名前を人数表示に置き換える。分配先は空に、購入担当は担当なしに戻す。", "仲間と使うグループのオーナーなら、一番前から参加しているメンバーにオーナーを引き継ぐ。ほかにメンバーがいなければ、そのグループを解散する。", "途中で処理が止まっても、続きから最後まで進む。"], "screens": ["S-22"], "apis": ["group-13", "group-14"], "apiRef": "退会の確かめ、退会する"}, {"id": "G-06", "title": "グループを解散する", "ctx": "group", "text": "オーナーとして、グループを解散したい。もう使わない集まりのデータを片づけるため。", "ac": ["解散できるのはオーナーだけ。自分用グループは解散できない。", "解散を始めたら招待リンクは使えなくなり、そのあとの書き込みは断る。", "メンバー一覧、招待リンク、チケット申込、品目とグッズリストと画像、頼まれ物はすぐに消す。", "公演日が解散した日以前の参戦は、公演の写し（公演、アーティスト名、セトリ）を付けて各メンバーに残す。参戦記録がなくても残す。", "公演日が解散した日より後の参戦は消す。", "残った参戦記録の同行者は「同行者2名」のように人数表示に置き換える。", "解散の前に、何が消えて何が残るかを画面で示して確認する。"], "screens": ["S-20"], "apis": ["group-11", "group-12"], "apiRef": "解散の確かめ、解散する"}, {"id": "G-07", "title": "メンバーをグループから外す", "ctx": "group", "text": "オーナーとして、メンバーをグループから外したい。もう一緒に行かなくなった人に、これからの予定や準備を見せないため。", "ac": ["外せるのはオーナーだけ。自分用グループにはほかのメンバーがいないので、この操作はない。", "オーナーは自分自身を外せない。抜けるときは先にオーナーを引き継ぐ（G-08）。", "外す前に、外された人のデータのうち何が消えて何が残るかを画面で示して確認する。", "外された人は、そのグループの公演、チケット、グッズを見られず、書き込みもできなくなる。", "そのグループでの外された人の参戦は、解散と同じ扱いにする。公演日が外した日以前の参戦は公演の写しを付けて本人に残し、これからの予定は消す。", "外された人が申込者のチケット申込は消し、まだ届いていないリマインドを取り消す。", "外された人の頼まれ物と下書きは消す。購入担当だった品目は担当なしに、分配先だった割当は空に戻す。", "ほかのメンバーの参戦記録で外された人が同行者になっていたら、名前を人数表示に置き換える。", "外された人も、あとで招待リンクから入り直せる。", "途中で処理が止まっても、続きから最後まで進む。"], "screens": ["S-21"], "apis": ["group-09", "group-10"], "apiRef": "抜ける・外すの確かめ、メンバーを外す"}, {"id": "G-08", "title": "自分からグループを抜ける", "ctx": "group", "text": "メンバーとして、自分からグループを抜けたい。退会はせずに、使わなくなったグループだけをやめるため。", "ac": ["抜けたときに消えるものと残るものは、G-07で外されたときと同じ。", "オーナーが抜けるときは、一番前から参加しているメンバーにオーナーを引き継ぐ。ほかにメンバーがいなければ、抜けるかわりに解散を案内する。", "自分用グループは抜けられない。"], "screens": ["S-20"], "apis": ["group-09", "group-10"], "apiRef": "抜ける・外すの確かめ、メンバーを外す（自分）"}, {"id": "C-01", "title": "ツアーをまとめて登録する", "ctx": "catalog", "text": "メンバーとして、ツアーとその公演をまとめて登録したい。同じツアーの公演を1件ずつ入れ直す手間を省くため。", "ac": ["ツアーには、ツアー名、グッズの販売時間などの情報、公式サイトのURLを入れられる。", "公演には、日付、会場、開場時刻、開演時刻、公式サイトのURLを入れられる。", "登録した公演は、グループのメンバー全員に見える。"], "screens": ["S-08"], "apis": ["catalog-13", "catalog-14"], "apiRef": "公演の下書きを作る、公演の下書きを確定する"}, {"id": "C-02", "title": "単発の公演やフェスを登録する", "ctx": "catalog", "text": "メンバーとして、ツアーに属さない公演を、公演名と出演するアーティストを付けて登録したい。フェスや対バンも記録するため。", "ac": ["ツアーがない公演には公演名を必ず入れる。", "1つの公演に複数のアーティストを、出演順で付けられる。"], "screens": ["S-08"], "apis": ["catalog-13", "catalog-14"], "apiRef": "公演の下書きを作る、公演の下書きを確定する"}, {"id": "C-03", "title": "下書きを確かめてから公演を確定する", "ctx": "catalog", "text": "メンバーとして、公演の登録内容を下書きとして保存し、確かめてから確定したい。入力の途中で手を止めても、内容を失わないため。", "ac": ["会場やアーティストが決まっていなくても下書きにできる。", "確定するまで、公演一覧には出ない。", "下書きを作るのと同じ窓口を、MVP2の自動入力も使う。"], "screens": ["S-06", "S-08"], "apis": ["catalog-12", "catalog-13", "catalog-14"], "apiRef": "公演の下書き一覧、公演の下書きを作る・直す・消す・確定する"}, {"id": "C-04", "title": "登録した会場を選び直す", "ctx": "catalog", "text": "メンバーとして、一度登録した会場を、次の公演の登録で選びたい。最寄り駅やメモを毎回調べ直さないため。", "ac": ["会場には最寄り駅とメモを入れられる。", "公演で使っている会場は消せない。", "選べるのは同じグループの会場だけ。"], "screens": ["S-08", "S-09"], "apis": ["catalog-04", "catalog-05", "catalog-06"], "apiRef": "会場一覧、会場を作る・直す・消す"}, {"id": "C-05", "title": "登録したアーティストを選ぶ", "ctx": "catalog", "text": "メンバーとして、公演のアーティストを、登録済みのアーティストから選びたい。表記ゆれで同じアーティストが2つにならないようにするため。", "ac": ["正規化した名前が同じアーティストは、グループの中で2つ登録できない。", "公演で使っているアーティストは消せない。"], "screens": ["S-08", "S-09"], "apis": ["catalog-01", "catalog-02", "catalog-03"], "apiRef": "アーティスト一覧、アーティストを作る・直す・消す"}, {"id": "C-06", "title": "過去の公演をさかのぼって登録する", "ctx": "catalog", "text": "ユーザーとして、yoinを使い始める前に行った公演を登録したい。昔の参戦も同じ場所に残すため。", "ac": ["開場時刻と開演時刻は空でもよい。", "1人で行った公演は自分用グループに登録できる。"], "screens": ["S-08"], "apis": ["catalog-13", "catalog-14"], "apiRef": "公演の下書きを作る、公演の下書きを確定する（時刻は空でよい）"}, {"id": "C-07", "title": "公演の情報を確かめる", "ctx": "catalog", "text": "メンバーとして、公演の日付、会場と最寄り駅、開場・開演時刻、ツアーのグッズ販売時間、公式サイトのURLを1つの画面で見たい。当日までに毎回サイトを探さずに済むようにするため。", "ac": ["公演一覧は、これからの公演と過去の公演に分けて見せる。"], "screens": ["S-06", "S-07"], "apis": ["catalog-09", "catalog-10"], "apiRef": "公演一覧、公演を見る"}, {"id": "C-08", "title": "公演の情報を直す", "ctx": "catalog", "text": "メンバーとして、登録した公演の日時や会場を直したい。発表後に変わった情報に合わせるため。", "ac": ["グループのメンバーなら誰でも直せる。"], "screens": ["S-09"], "apis": ["catalog-11", "catalog-08"], "apiRef": "公演を直す、ツアーを直す"}, {"id": "C-09", "title": "セトリを入力する", "ctx": "catalog", "text": "メンバーとして、公演が終わったらセトリを曲順に入力したい。どの曲が演奏されたかを忘れないうちに残すため。", "ac": ["曲名は文字列で入れる。曲目ごとに「アンコール」などのメモを付けられる。", "フェスでは、曲目ごとにどのアーティストの曲かを選べる。", "グループの誰が入力しても、全員に同じセトリが見える。", "2人が同時に編集したとき、古い版からの保存は断り、上書きしない。"], "screens": ["S-10"], "apis": ["catalog-15", "catalog-16"], "apiRef": "セトリを見る、セトリを保存する"}, {"id": "A-01", "title": "公演に行く予定を登録する", "ctx": "attendance", "text": "メンバーとして、公演に「行く」と登録したい。グループの誰がどの公演に行くかを共有するため。", "ac": ["同じ公演に2回は登録できない。", "編集と取り消しは本人だけ。"], "screens": ["S-07"], "apis": ["attendance-02", "attendance-03"], "apiRef": "参戦する、参戦をやめる"}, {"id": "A-02", "title": "公演に誰が行くかを見る", "ctx": "attendance", "text": "メンバーとして、公演ごとにグループの誰が行くかを見たい。一緒に行く相手とチケットやグッズの相談をするため。", "ac": ["行った公演では、ほかのメンバーの参戦記録（座席、同行者、ひとこと）も見られる。"], "screens": ["S-07"], "apis": ["attendance-01"], "apiRef": "公演の参戦一覧"}, {"id": "A-03", "title": "参戦記録を残す", "ctx": "attendance", "text": "メンバーとして、公演のあとに座席、同行者、ひとことを残したい。どの席から誰と見たかをあとから思い出すため。", "ac": ["座席はブロック、列、番号などを自由に書ける。", "同行者は、グループのメンバーから選ぶか、yoinを使っていない人の名前を書く。", "参戦記録があれば「行った」として扱う。", "同じグループのほかのメンバーも読める。編集と削除は本人だけ。", "解散したグループや、抜けた・外されたグループの参戦記録は、本人だけが読める。"], "screens": ["S-11"], "apis": ["attendance-04", "attendance-05"], "apiRef": "参戦記録を保存する、参戦記録を消す"}, {"id": "A-04", "title": "自分の参戦を一覧で見る", "ctx": "attendance", "text": "ユーザーとして、グループをまたいで自分の参戦を、これからの予定と行った公演に分けて見たい。自分がいつどの公演に行ったかを1か所で見るため。", "ac": ["解散したグループの過去の参戦も、公演の写しで出す。題名、日付、会場、セトリが見られる。", "解散後の参戦は本人だけが見られる。同行者は人数で出す。", "行った公演は年代（2020年代など）でまとめ、その中を年ごとに区切って見られる。年を選んでその年だけに絞れる（2026-11-21、大関さんの要望）。"], "screens": ["S-18"], "apis": ["attendance-06", "attendance-07", "attendance-08"], "apiRef": "自分の参戦一覧、自分の参戦の年、自分の参戦を見る"}, {"id": "A-05", "title": "アーティストごとに参戦をまとめる", "ctx": "attendance", "text": "ユーザーとして、自分の参戦をアーティストごとにまとめて見たい。あるアーティストのライブに何回、いつ行ったかを知るため。", "ac": ["グループをまたいで、正規化した名前でまとめる。解散後の参戦も写しのアーティスト名でまとめる。", "改名、同じ名前の別のアーティスト、表記ゆれで集計がずれることは、MVP1では受け入れる。"], "screens": ["S-19"], "apis": ["attendance-09"], "apiRef": "アーティストごとの参戦"}, {"id": "T-01", "title": "チケット申込を登録する", "ctx": "ticket", "text": "メンバーとして、チケットを申し込んだら、その受付と期限を登録したい。複数の受付の状態と期限をまとめて管理するため。", "ac": ["受付名（「FC先行」など）、枚数、受取方法（コンビニ発券かスマチケ）、結果発表日時、入金期限、受取開始日時を入れられる。期限は分かっているものだけでよい。", "登録した人が申込者になる。", "選べるのは同じグループの公演だけ。", "編集と削除は申込者だけ。"], "screens": ["S-12", "S-13"], "apis": ["ticket-02", "ticket-04", "ticket-06"], "apiRef": "申込を作る、申込を直す、申込を消す"}, {"id": "T-02", "title": "申込の状態を進める", "ctx": "ticket", "text": "申込者として、当落、入金、受取に合わせて申込の状態を進めたい。次に何をすればよいかを見失わないため。", "ac": ["状態は「申込済み → 当選／落選 → 入金済み／期限切れ → 受取済み」の順に進む。先着の申込は当選から始めてよい。", "当選のまま入金期限を過ぎた申込は、自動で期限切れとして見せる。状態は保存せず、入金期限と今の時刻から計算する。", "入金したのに入金済みにし忘れていた場合に備えて、申込者は期限切れの申込を入金済みに直せる。", "受取できるかどうかは、受取開始日時と今の時刻から画面に出す。"], "screens": ["S-13"], "apis": ["ticket-05"], "apiRef": "申込の状態を変える"}, {"id": "T-03", "title": "期限のリマインドを受け取る", "ctx": "ticket", "text": "申込者として、結果発表、受取開始、入金期限を、間に合う時刻に通知で受け取りたい。発券や入金を忘れないため。", "ac": ["結果発表と受取開始は、その時刻に届く。受取開始の通知は入金済みにしたときに予約するので、期限切れの申込には届かない。", "入金期限は、前日の20時と締切の3時間前に届く。", "期限を直したら、届く時刻も直す。落選、申込の削除、解散では、まだ届いていない通知を取り消す。", "登録したときに届く時刻を過ぎていたら、期限の前なら次の送信で届け、期限を過ぎていれば届けない。", "リマインドは申込者だけに届く。", "まれに同じ通知が2回届くことは許す。届かないことは避ける。"], "screens": ["S-12", "S-13"], "apis": ["ticket-02", "ticket-04", "ticket-05", "ticket-06"], "apiRef": "申込を作る・直す・状態を変える・消す（リマインドの予約はその中で行う）"}, {"id": "T-04", "title": "公演ごとの申込状況を見る", "ctx": "ticket", "text": "メンバーとして、公演ごとにグループの誰がどの受付に申し込み、今どの状態かを見たい。同じ受付に重ねて申し込んだり、取り損ねたりしないため。", "ac": ["申込ごとに、申込者、受付名、枚数、状態（期限切れを含む）を出す。", "グループのメンバーなら誰でも見られる。直せるのは申込者だけ（T-01）。"], "screens": ["S-12"], "apis": ["ticket-01"], "apiRef": "申込一覧（`concertId`）"}, {"id": "T-05", "title": "スマチケを分配する", "ctx": "ticket", "text": "申込者として、スマチケを1枚ずつ誰に渡すかを決め、渡し終えたら記録したい。当日に誰が何枚目を持っているかを分かるようにするため。", "ac": ["分配先は、同じグループのメンバーか、yoinを使っていない人の名前。", "枚数の分だけ、何枚目かを指定して割り当てる。", "分配先を決められるのは申込者だけ。"], "screens": ["S-13"], "apis": ["ticket-07"], "apiRef": "分配を保存する"}, {"id": "M-01", "title": "品目を写真付きで登録する", "ctx": "merch", "text": "メンバーとして、品名、価格、写真を付けてグッズの品目を登録したい。公式の一覧の写真と、買う物を結びつけるため。", "ac": ["写真はユーザーが撮った写真かスクショ。", "品目はツアーに属し、ツアーのない公演では公演に属する。", "下書きを作り、確かめてから確定する。", "写真は同じグループのメンバーだけが見られる。"], "screens": ["S-14"], "apis": ["merch-01", "merch-02", "merch-04"], "apiRef": "画像を上げる準備、品目の下書きを作る・直す・確定する"}, {"id": "M-02", "title": "欲しい物と数を入れる", "ctx": "merch", "text": "メンバーとして、公演のグッズリストで、欲しい品目と数を入れたい。誰が何をいくつ欲しいかを一覧にするため。", "ac": ["載せられるのは、その公演か、公演のツアーの品目だけ。", "自分の分も同じように入れる。購入担当が自分と違う行が「頼まれ物」になる。", "頼まれ物の編集と削除は、頼んだ本人だけ。"], "screens": ["S-15"], "apis": ["merch-06", "merch-07"], "apiRef": "グッズリストを見る、欲しい数を入れる・消す"}, {"id": "M-03", "title": "購入担当を決める", "ctx": "merch", "text": "メンバーとして、品目ごとに当日誰が買いに行くかを決めたい。同じ物を2人が買ったり、誰も買わなかったりしないようにするため。", "ac": ["担当にできるのは同じグループのメンバーだけ。", "グループのメンバーなら誰でも決められる。"], "screens": ["S-15"], "apis": ["merch-08"], "apiRef": "購入担当を決める・外す"}, {"id": "M-04", "title": "買う物と合計金額を見る", "ctx": "merch", "text": "購入担当として、自分が買う品目と数、そのうち誰に頼まれた物か、合計金額を見たい。物販の列で迷わずに買うため。", "ac": ["合計金額は品目の価格と数から計算する。価格がない品目は合計に入らないことを示す。", "精算と割り勘はしない。"], "screens": ["S-16"], "apis": ["merch-10"], "apiRef": "自分が買う物"}, {"id": "M-05", "title": "頼んだ物を確かめる", "ctx": "merch", "text": "頼んだ人として、自分が頼んだ品目、数、購入担当、金額を見たい。あとでいくら渡せばよいかを知るため。", "ac": ["公演ごとに、自分が頼んだ品目と数、購入担当、価格から計算した金額を出す。", "購入担当が付けた買えた・売り切れの印も出す（M-06）。"], "screens": ["S-17"], "apis": ["merch-11"], "apiRef": "自分が頼んだ物"}, {"id": "M-06", "title": "物販で買えた品目と売り切れの品目に印を付ける", "ctx": "merch", "text": "購入担当として、物販で買えた品目と売り切れだった品目に印を付けたい。買えたかどうかを頼んだ人にすぐ伝えるため。", "ac": ["購入担当は、品目ごとに「買えた」か「売り切れ」の印を付けられる。付けた印は外せる。", "頼んだ人は、自分の頼まれ物に付いた印を見られる（M-05）。", "合計金額は、売り切れの品目を除いた額も出す。", "精算と割り勘はしない。"], "screens": ["S-16"], "apis": ["merch-09"], "apiRef": "印を付ける"}, {"id": "N-01", "title": "通知を受け取る端末を登録する", "ctx": "notification", "text": "ユーザーとして、自分の端末でyoinの通知を受け取れるようにしたい。リマインドを見逃さないため。", "ac": ["初回の案内画面で、ホーム画面への追加と通知の許可を案内する。", "iPhoneは、ホーム画面に追加したときだけ登録できる。", "1人が複数の端末を登録できる。"], "screens": ["S-03", "S-23"], "apis": ["notification-02"], "apiRef": "通知先を登録する"}, {"id": "N-02", "title": "通知が届かない状態を知る", "ctx": "notification", "text": "ユーザーとして、通知が届かない状態になっていたら画面で知りたい。リマインドが来ないまま期限を過ぎないようにするため。", "ac": ["端末を登録していないとき、送れなかった端末があるときに、画面で示す。"], "screens": ["S-05", "S-23"], "apis": ["notification-01"], "apiRef": "通知先一覧"}, {"id": "N-03", "title": "通知から申込を開く", "ctx": "notification", "text": "申込者として、通知を押したら、その申込の画面を開きたい。すぐに入金や発券の確認をするため。", "ac": ["通知を押すと、その申込の画面が開く。", "申込がもう無いとき（消した、抜けた、解散した）は、見つからないと出す。"], "screens": ["S-13"], "apis": ["ticket-03"], "apiRef": "申込を見る（リマインドの`url`で開く）"}, {"id": "N-04", "title": "通知を受け取る端末を外す", "ctx": "notification", "text": "ユーザーとして、登録した端末を通知先から外したい。手放した端末や使わなくなった端末に通知が届き続けないようにするため。", "ac": ["自分が登録した端末を一覧で見て、1台ずつ外せる。", "外した端末には、それ以降リマインドを送らない。", "退会したときは、すべての端末をまとめて外す（G-05）。"], "screens": ["S-23"], "apis": ["notification-01", "notification-03"], "apiRef": "通知先一覧、通知先を外す"}], "edges": [["S-02", "S-03", false], ["S-01", "S-05", false], ["S-03", "S-05", false], ["S-05", "S-04", false], ["S-04", "S-05", false], ["S-05", "S-06", false], ["S-06", "S-07", false], ["S-06", "S-08", false], ["S-08", "S-07", false], ["S-07", "S-09", false], ["S-07", "S-10", false], ["S-07", "S-11", false], ["S-07", "S-12", false], ["S-12", "S-13", false], ["S-07", "S-15", false], ["S-15", "S-14", false], ["S-15", "S-16", false], ["S-15", "S-17", false], ["S-05", "S-18", false], ["S-18", "S-19", false], ["S-05", "S-20", false], ["S-20", "S-21", false], ["S-05", "S-22", false], ["S-22", "S-23", false], ["push", "S-13", true]], "mermaid": "flowchart TD\n  invite[S-02 招待] --> onboard[S-03 初回の案内]\n  login[S-01 ログイン] --> home\n  onboard --> home[S-05 グループのホーム]\n  home --> switch[S-04 グループの切り替え]\n  switch --> home\n  home --> concerts[S-06 公演一覧]\n  concerts --> concert[S-07 公演]\n  concerts --> draft[S-08 公演の下書き]\n  draft --> concert\n  concert --> concertEdit[S-09 公演の編集]\n  concert --> setlist[S-10 セトリ]\n  concert --> record[S-11 参戦記録]\n  concert --> tickets[S-12 公演の申込]\n  tickets --> ticket[S-13 申込]\n  concert --> merchList[S-15 グッズリスト]\n  merchList --> merchDraft[S-14 品目の下書き]\n  merchList --> buy[S-16 買う物]\n  merchList --> asked[S-17 頼んだ物]\n  home --> mine[S-18 自分の参戦]\n  mine --> byArtist[S-19 アーティストごと]\n  home --> settings[S-20 グループの設定]\n  settings --> members[S-21 メンバーと招待]\n  home --> me[S-22 自分の設定]\n  me --> devices[S-23 通知先]\n  push((通知)) -.押す.-> ticket", "flowNotes": ["下の段の画面（公演・申込など）は、パスに`groupId`を含む画面のURLを持つ。通知を押したときは、リマインドの`url`（`/groups/<groupId>/ticket-applications/<id>`）で申込の画面を開く。", "ログインの方式（メールとパスワードか、メールに届くコードか）は最初の1本の要件で決める（論点の記録の「login」）。S-01はCognitoの画面か自前の画面かも、そこで決める。"], "errors": [["`invalid_input`", "422", "形・値の範囲が合わない。欄ごとの理由を`errors`に入れる"], ["`not_registered`", "403", "JWTはあるが`users`の行が無い（招待の2本のほか）"], ["`account_closing`", "403", "本人が退会を始めている"], ["`not_found`", "404", "行が無い、別グループの行、自分が外された・抜けている途中のグループ"], ["`forbidden`", "403", "メンバーだが、その操作をできる人ではない（申込者でない、オーナーでない、自分用グループで招待リンクを出す、など）"], ["`group_closing`", "409", "グループが解散を始めている。読むことはでき、書き込みだけを断る"], ["`id_conflict`", "409", "作成で送ったIDが、中身の違う行か別グループの行と重なる"], ["`already_exists`", "409", "一意の決まりにぶつかる（同じ公演への2回目の参戦、同じ名前のアーティスト）"], ["`in_use`", "409", "公演で使っている会場・アーティストを消そうとした"], ["`stale_version`", "409", "セトリを古い版から保存しようとした"], ["`invalid_transition`", "409", "申込の状態の移り方に無い変更（落選から入金済みなど）"], ["`invite_unusable`", "409", "招待リンクが期限切れ・上限・解散で取り消し済み。どれかは区別しない。招待リンクを個別に取り消すAPIはMVP1に無い"], ["`last_member`", "409", "ほかにメンバーがいないオーナーが抜けようとした。画面は解散を案内する"], ["`internal`", "500", "想定していない失敗。`detail`は付けない"]], "rules": [{"h": "つなぎ先と認証", "lines": ["", "- 画面はAPI GatewayのURLへ直接送る。CORSは画面のドメインだけを許す。ブラウザが本番の要求の前に送る`OPTIONS`（JWTを付けない事前確認）は、API GatewayのCORSの設定で答え、JWTの確かめとLambdaには回さない。", "- すべてのパスでCognitoのJWTが要る。JWTの無い要求はAPI Gatewayが401で断るので、Lambda `api`には届かない。", "- `api`は、JWTの`sub`に結びつく`users`の行が`active`かを毎回確かめる。行が無ければ`not_registered`、`withdrawing`なら`account_closing`で断る。", "- 例外は招待の2本（`GET /invites/{token}`と`POST /invites/{token}/accept`）。ここだけは`users`の行が無いJWTも受ける。招待リンクを通らずにユーザーを作らない決まり（データモデル「退会の手順」）を守るため、APIで行を作るのは`accept`だけにする。最初のオーナーは、デプロイの流れで流す初期データの手順で作る（APIは作らない。2026-11-21に大関さんが決めた）。", ""]}, {"h": "パスの形", "lines": ["", "- グループの中の資源は、`/groups/{groupId}/...`の下に置く。公開関数には、パスのグループIDとJWTのユーザーをそのまま渡す。最初の`FOR SHARE`のロックは、このグループIDで取る。グループの外の書き込み（グループを作る、通知先の登録と削除）は、操作した人の`users`の行を`FOR SHARE`でロックして`active`かを確かめてから書く。退会の開始と重なっても、退会が通ったあとに行ができない（データモデル「書き込みの順番」）。", "- パスの資源のIDが、パスのグループのものでなければ`not_found`にする。別グループの行があることも、中身も返さない。本文で送るID（申込の`concertId`、同行者・購入担当・分配の`userId`、下書きの会場とアーティスト、品目の属するツアーと公演）と、`/me`の下の他人の行のIDも同じで、無いときと同じ`not_found`にする。", "- グループをまたぐもの（自分の参戦の一覧、通知先、退会）は`/me/...`に置く。", "- 版の番号はパスに付けない。APIは外部に公開せず、画面と同時にデプロイするため。Service Workerが古い画面を持っているあいだに互換を壊す変更を出すときは、前の形の要求も受ける期間を、その変更の設計書に書く。", ""]}, {"h": "中身の形", "lines": ["", "- 要求と応答の中身はJSONで、キーはキャメルケース（`concertId`）にする。", "- 公演の日は`YYYY-MM-DD`、開場・開演時刻は`HH:mm`（どちらも日本時間）。チケットの期限など`timestamptz`の値は、時差を付けたISO 8601（`2027-01-10T20:00:00+09:00`）で受け、応答は時差`+09:00`で返す。", "- 入力はZodで確かめ、知らないキーがあれば`invalid_input`で断る。", "- 部分更新（`PATCH`）では、送らなかった欄は変えず、`null`を送った欄は空にする（`.claude/rules/coding-standards.md`）。", "- 一覧はページを分けない。公演と参戦の一覧は、`when=upcoming|past`と`year`で絞れる。", ""]}, {"h": "作成を2回送ったとき", "lines": ["", "公演会場の近くでは電波が弱く、返事が届かずに同じ作成を送り直すことがある。作成のAPIは次のように扱う。", "", "- 画面がUUIDv7のIDを作り、本文の`id`で送る。サーバーはUUIDの版が7でなければ`invalid_input`にする。", "- 同じIDの行がパスのグループにあり、中身も同じなら、1回目と同じ応答を状態コード200で返す。1回目は201。", "- 同じIDの行があって中身が違う場合と、同じIDの行が別のグループにある場合は、`id_conflict`で断る。どちらも行の中身は返さない。", "- 作成のほかの操作は、2回送っても結果が同じになる形にする。状態を進める操作は「どの状態にするか」を送り、すでにその状態なら何もせず200を返す。一覧を丸ごと置き換える操作は`PUT`にする。", "- 消す操作（`DELETE`）は、行がもう無くても204を返す。1回目と2回目を同じ応答にするため。行が別のグループにあるときも同じ204にし、あることを知らせない。行があってその人が消せないとき（申込者でないなど）だけ`forbidden`にする。", "- 比べる「中身」は、サーバーが値を直したあとの形で比べる。例えば画像は、一時置き場のキーをコピー先のキーに直してから比べる。コピー先のキーは、下書きIDと一時置き場のキーから決まる形（`groups/<groupId>/drafts/<userId>/<draftId>/<一時置き場のキーの末尾>`）にする。", "", "2本の要求が重なったときは、次のように扱う。グループの行の`FOR SHARE`は書き込み同士を待たせないので、行ごとに決める。", "", "- 作成は`INSERT ... ON CONFLICT DO NOTHING`で書き、書けなかったら読み直して、上の決まりで比べる。一意の決まりにぶつかって500にしない。グッズリストの行も同じ形で、最初の書き込みで作る。", "- 招待から参加するときは招待リンクの行を、下書きを直す・消す・確定するときは下書きの行を、申込を直す・状態を変える・消すときは申込の行を、`FOR UPDATE`でロックしてから確かめる。上限の最後の1回に2人が同時に参加しても、1人だけが入る。", "- セトリは`UPDATE ... WHERE version = <送った版>`で比べて書く。まだ行の無いセトリの最初の保存が2本重なったら、あとのほうを`stale_version`にする。", "", "IDを画面で作らないものが4つある。", "", "| 操作 | 2回送ったときに同じ結果になる理由 |", "|---|---|", "| 招待リンクから参加する | 1人のCognitoのユーザーに`users`の行は1つだけで、すでにメンバーなら、リンクの状態を見る前に200を返す |", "| 通知先を登録する | `endpoint`が一意なので、同じ端末の2回目は同じ行を返す |", "| 頼まれ物・購入担当・印 | 品目と頼んだ人（または品目）の組で1行なので、`PUT`で置き換える |", "| 画像を上げる準備 | 行を作らない。2回目は別のキーとURLを返し、使われなかった一時置き場の画像は1日で消える |", ""]}, {"h": "エラーの形", "lines": ["", "エラーはRFC 9457の`application/problem+json`で返し、`code`を足す。画面は`code`だけを見て文言を出し分ける。", "", "```json", "{", "  \"type\": \"about:blank\",", "  \"title\": \"Unprocessable Content\",", "  \"status\": 422,", "  \"code\": \"invalid_input\",", "  \"errors\": [{ \"path\": \"quantity\", \"code\": \"too_small\" }]", "}", "```", "", "`errors`は`invalid_input`のときだけ付ける。`already_exists`では既存の行のID（`existingId`）を、`stale_version`では今の版（`current`。`version`と`items`）を、同じ本文の欄として足す。`detail`には個人の情報を書かない（データモデル「退会で消す範囲」のログの方針と同じ）。", "", "| `code` | 状態コード | いつ |", "|---|---|---|", "| `invalid_input` | 422 | 形・値の範囲が合わない。欄ごとの理由を`errors`に入れる |", "| `not_registered` | 403 | JWTはあるが`users`の行が無い（招待の2本のほか） |", "| `account_closing` | 403 | 本人が退会を始めている |", "| `not_found` | 404 | 行が無い、別グループの行、自分が外された・抜けている途中のグループ |", "| `forbidden` | 403 | メンバーだが、その操作をできる人ではない（申込者でない、オーナーでない、自分用グループで招待リンクを出す、など） |", "| `group_closing` | 409 | グループが解散を始めている。読むことはでき、書き込みだけを断る |", "| `id_conflict` | 409 | 作成で送ったIDが、中身の違う行か別グループの行と重なる |", "| `already_exists` | 409 | 一意の決まりにぶつかる（同じ公演への2回目の参戦、同じ名前のアーティスト） |", "| `in_use` | 409 | 公演で使っている会場・アーティストを消そうとした |", "| `stale_version` | 409 | セトリを古い版から保存しようとした |", "| `invalid_transition` | 409 | 申込の状態の移り方に無い変更（落選から入金済みなど） |", "| `invite_unusable` | 409 | 招待リンクが期限切れ・上限・解散で取り消し済み。どれかは区別しない。招待リンクを個別に取り消すAPIはMVP1に無い |", "| `last_member` | 409 | ほかにメンバーがいないオーナーが抜けようとした。画面は解散を案内する |", "| `internal` | 500 | 想定していない失敗。`detail`は付けない |", ""]}, {"h": "時間のかかる操作", "lines": ["", "解散・退会・メンバーを外す・抜けるは、受け付けたら202を返し、続きは`erasure-worker`が進める（データモデル「解散と退会」）。応答の本文は`{ \"accepted\": true }`だけにする。2回目の送信も202にする。この4本だけは、同じ対象の終わっていないジョブ（`erasure_jobs`）があり、操作した人がそのジョブを始められる人（退会と抜けるは本人、解散と外すはグループのオーナー）なら、`account_closing`・`not_found`・`group_closing`の確かめより先に202を返す。それ以外の人には、ふだんの確かめのとおり`not_found`などを返し、処理中かどうかを知らせない（2026-11-21、大関さんが決定）。", ""]}, {"h": "画像", "lines": ["", "- 上げるときは、`POST /groups/{groupId}/image-uploads`で一時置き場へのアップロード用URLとキーを受け取り、端末がS3へ上げる。キーは`uploads/<groupId>/<userId>/<UUID>`の形にする。そのあと下書きを作るか直す要求でキーを送ると、`api`はキーのグループと本人がパスのグループと操作した人に合うかを確かめ、合わなければ`not_found`で断る。合えば、ロックを持ったままS3の中でコピーして確定する（データモデルR13。2026-11-21、大関さんが決定）。", "- 見るときは、品目を返す応答に有効期限5分の取得用URL（`imageUrl`）を入れて返す。画面は期限が切れたら一覧を取り直す（データモデルR12）。", ""]}, {"h": "型を画面と共有する", "lines": ["", "- Honoのルートは、文脈ごとのファイルを`src/functions/api/`でつなぎ、つないだ型`AppType`を出す。画面は`hono/client`の`hc<AppType>`で呼び、`import type`だけで型を受け取る（ADR-0004の追記）。", "- 入力のZodのスキーマは`src/functions/api/`の文脈ごとのファイルに置き、公開関数（`src/contexts/<文脈>/index.ts`）には確かめたあとの値を渡す。", ""]}], "remindText": ["申込を作る・直す・状態を変える・消すの4つの操作は、どれも同じ1つの関数でリマインドを合わせる。関数は、申込の今の状態と期限から「あるべき予約」を計算し、今ある予約との差だけを作る・時刻を直す・取り消す。差は、状態と期限の値で見る。状態も期限の値も変わっていない予約（もう送ったものを含む）は、送信時刻を計算し直さず、そのままにする。受付名だけを直しても、期限を過ぎてから1分後に入れた予約は先送りされず、送った予約が作り直されることもない。", "送信時刻を過ぎた予約の扱いは、データモデル「届ける時刻」のとおり（期限の前なら1分後、過ぎていれば作らない）。当選してから入金期限を入れたときも、この関数で入金期限の予約ができる。"] rsを消してからusersを消す） |", "| SET NULL | setlist_items.artist_id |", "", "- 同じスキーマの中で別の行を指すときは、`(group_id, venue_id)`のように所属を含む複合外部キーにする。参照される側に`(group_id, id)`の一意制約を付ける。別グループの会場や品目は結べない。", "- 文脈をまたぐID（公演ID、ツアーID、グループID、ユーザーID）には、RESTRICTの外部キーだけを張る。CASCADEは使わない。消す順番はコードが決め、順番を間違えたときにDBが断る。", "- このため、マイグレーションはgroups → catalog → attendance・ticket・merch・notificationの順に流す。", ""], "グループの所属と権限（YADR-01）": ["", "- 操作した人のIDは、リクエストの中身ではなくJWTから取る。", "- 各文脈の公開関数は「操作した人」と「グループID」を受け取り、対象の行と、指定されたID（公演、会場、品目、メンバーなど）がすべて同じグループのものかを確かめる。違えば、存在しないときと同じ「見つからない」を返し、参照先の中身も返さない。", "- グッズリストに載せる品目は、そのリストの公演か、公演のツアーのものに限る。", "", "| 操作 | できる人 |", "|---|---|", "| アーティスト、ツアー、公演、会場、セトリ、品目の登録・編集 | グループのメンバー全員 |", "| チケット申込の編集・削除、分配先の指定 | 申込者だけ |", "| 購入担当の指定 | グループのメンバー全員。担当にできるのは同じグループのメンバー |", "| 頼まれ物の編集・削除 | 頼んだ本人だけ |", "| 買えた・売り切れの印を付ける・外す | その品目の購入担当だけ（R14） |", "| 参戦と参戦記録（座席、同行者、ひとこと）を見る | グループのメンバー全員。解散や外されたあとに本人に残った参戦は本人だけ（R8） |", "| 参戦と参戦記録の編集・削除 | 本人だけ |", "| 招待リンクの発行、解散 | オーナーだけ（自分用グループではできない） |", "| メンバーを外す | オーナーだけ。自分自身は外せない（R10） |", "| グループを抜ける | メンバー本人。オーナーは一番前から参加しているメンバーに引き継いでから抜ける。ほかにメンバーがいなければ解散を案内する。自分用グループは抜けられない（R10） |", ""], "書き込みの順番（YADR-02）": ["", "- 書き込みはすべて1つのDBトランザクションの中で行う。最初にグループの文脈の公開関数で、グループ（`groups.status = active`）と操作した人（`users.status = active`、`members.status = active`）を確かめ、その行を`FOR SHARE`でロックする。保存が終わるまでロックを持つ。", "- 解散、退会、メンバーを外す・抜けるの開始は、同じ行を`disbanding` / `withdrawing` / `leaving`に更新する。更新は実行中の書き込みが終わるのを待ってから確定し、そのあとの書き込みは断られる。", "- 同行者や分配先に別のメンバーを指定するときは、指定されたユーザーの行も同じようにロックして`active`かを確かめる。", "- ほかの文脈のテーブルを読むことにはならない。グループの公開関数が同じトランザクションに参加するだけ。", "- LambdaからNeonへの接続は、トランザクションの途中で判断を挟める方式にする（HTTPで1回ずつ送る方式は使わない）。道具は工程4で決める。", ""], "グループは1人でもよい": ["", "- 1人で行く公演も記録できるように、メンバーが1人だけのグループを認める。`groups.kind`で、仲間と使うグループ（`shared`）と自分用グループ（`personal`）を分ける。", "- ユーザー登録のときに、自分用グループを1つだけ自動で作る。招待リンクは出せず、解散もできない。グループ一覧では「自分用」として分けて見せる。", "- メンバーなら誰でも、仲間と使うグループを新しく作れる。新しい人の登録には、今までどおり招待リンクが要る。", ""], "アーティストごとのまとめ方": ["", "- アーティストはグループごとに登録する。公演とアーティストは`catalog.concert_artists` /* ---------- 軽いMarkdown ---------- */
function md(lines){
  let h="",i=0;
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){i++;continue;}
    if(l.startsWith("```")){let b=[];i++;while(i<lines.length&&!lines[i].startsWith("```"))b.push(lines[i++]);i++;h+=`<pre>${esc(b.join("\n"))}</pre>`;continue;}
    if(l.startsWith("|")){let rows=[];while(i<lines.length&&lines[i].startsWith("|"))rows.push(lines[i++]);
      const cells=r=>r.replace(/\\\|/g,"\u0000").trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim().replace(/\u0000/g,"|"));
      h+=`<div class="scroll"><table><thead><tr>${cells(rows[0]).map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue;}
    if(l.startsWith("- ")){let b=[];while(i<lines.length&&lines[i].startsWith("- "))b.push(lines[i++].slice(2));h+=`<ul>${b.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`;continue;}
    if(l.startsWith("#### ")){h+=`<h5>${inl(l.slice(5))}</h5>`;i++;continue;}
    h+=`<p>${inl(l)}</p>`;i++;
  }
  return h;
}

  const maxLines=Math.max(...steps.map(s=>Math.ceil(cols(s[1])/8.5)),side?Math.ceil(cols(side[1])/8.5):1,1);
  const W=114,G=18,P=6, H=Math.max(84,Math.ceil(30+maxLines*14.7+10)), n=steps.length+(side?1:0)+1;
  const width=P*2+n*W+(n-1)*G, height=H+P*2;
  let x=P, h="";
  const node=(t,sub,on,cls="")=>{const r=`<g class="pn ${on?"on":"off"} ${cls}" transform="translate(${x},${P})"><rect width="${W}" height="${H}" rx="10"/><text class="pt" x="10" y="20">${esc(t)}</text><foreignObject x="6" y="26" width="${W-12}" height="${H-30}"><div xmlns="http://www.w3.org/1999/xhtml" class="ps">${esc(sub)}</div></foreignObject></g>`; x+=W+G; return r;};
  const arrow=()=>`<path class="pa" d="M${x-G+2} ${P+H/2}h${G-6}" marker-end="url(#pa)"/>`;
  steps.forEach((s,i)=>{ if(i) h+=arrow(); h+=node(...s); });
  if(side){ h+=arrow(); h+=node(side[0],side[1],true,"side"); }
  h+=arrow(); h+=node(`応答 ${code}`, code===202?"続きは裏で進む":code===204?"行がもう無くても 204":code===201?"2回目は同じ中身で 200":"", true, "resp s"+code);
  return `<div class="pipe"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="要求が通る順番"><defs><marker id="pa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker></defs>${h}</svg></div>`;
}
function exampleBlock(id){
  const a=A[id], ex=EX[id]; if(!ex) return "";

  const m = ex.req? (ms.find(x=>x!=="GET"&&x!=="DELETE")||ms[0]) : (ms.includes("GET")?"GET":ms[ms.length-1]);

function refsOf(t){
  const out=[];
  t.cols.forEach(c=>{
    let tgt=COLREF[c.name]; if(!tgt) return;
    if(t.id==="catalog.setlist_items"&&c.name==="concert_id") tgt="catalog.setlists";
    if(t.id==="attendance.companions"&&c.name==="attendance_id") tgt="attendance.attendance_records";
    if(t.id===tgt) return;
    const cross = tgt.split(".")[0]!==t.schema;
    let rule;
    if(t.id==="groups.erasure_jobs") rule="外部キーなし";
    else if(/SET NULL/.test(c.desc)) rule="SET NULL";
    else if(/RESTRICT/.test(c.desc)) rule="RESTRICT";
    else if(cross) rule="RESTRICT";
    else if((CASCADE_PAIRS[t.id]||[]).includes(tgt)) rule="CASCADE";
    else if(t.id==="groups.groups"&&c.name==="owner_user_id") rule="RESTRICT";
    else if(t.id==="groups.members"&&c.name==="user_id") rule="RESTRICT";
    else rule="資料に無い";
    const tt=TBN[tgt];
    const comp = !cross && rule!=="外部キーなし" && tgt!=="groups.groups" && c.name!=="group_id" && t.cols.some(x=>x.name==="group_id") && tt && tt.cols.some(x=>x.name==="group_id");
    out.push({col:c.name,to:tgt,cross,rule,comp,conflict:DOC_CONFLICT[t.id+"."+c.name]||null,nullable:/null可/.test(c.desc)});

  return out;
}

function erLayout(){
  const W=232,RH=30,HH=34,GX=110,GY=26,P=14, pos={}, boxes=[];
  let maxH=0;
  ER_COLS.forEach((col,ci)=>{
    let y=P; const x=P+ci*(W+GX);
    col.forEach(s=>{
      const ts=DB.tables.filter(t=>t.schema===s);
      const h=HH+ts.length*RH+8;
      boxes.push({s,x,y,w:W,h});
      ts.forEach((t,i)=>pos[t.id]={x:x+6,y:y+HH+i*RH,w:W-12,h:RH-4});
      y+=h+GY;
    });
    maxH=Math.max(maxH,y);
  });
  return {pos,boxes,width:P*2+3*W+2*GX,height:maxH};
}
function erSVG(cur, showCommon){
  const {pos,boxes,width,height}=erLayout();

  if(cur){ near.add(cur); TBN[cur].refs.forEach(r=>near.add(r.to)); childrenOf(cur).forEach(r=>near.add(r.from)); }
  let lines="";
  DB.tables.forEach(t=>t.refs.forEach(r=>{
    const common = r.to==="groups.groups"||r.to==="groups.users";
    const hi = cur && (t.id===cur||r.to===cur);
    if(common && !showCommon && !hi) return;
    const a=pos[t.id], b=pos[r.to];
    let d;
    const ax=a.x, bx=b.x;
    if(Math.abs(ax-bx)<5){ const x=a.x+a.w; const off=24+Math.abs(a.y-b.y)/14; d=`M${x} ${a.y+a.h/2} C${x+off} ${a.y+a.h/2},${x+off} ${b.y+b.h/2},${x} ${b.y+b.h/2}`; }
    else if(ax>bx){ d=`M${a.x} ${a.y+a.h/2} C${a.x-55} ${a.y+a.h/2},${b.x+b.w+55} ${b.y+b.h/2},${b.x+b.w} ${b.y+b.h/2}`; }
    else { d=`M${a.x+a.w} ${a.y+a.h/2} C${a.x+a.w+55} ${a.y+a.h/2},${b.x-55} ${b.y+b.h/2},${b.x} ${b.y+b.h/2}`; }
    lines+=`<path class="fk ${RCLS(r.rule)}${hi?" hi":""}${common?" common":""}${cur&&!hi?" dim":""}" d="${d}" marker-end="url(#fk${hi?"h":""})"><title>${t.id}.${colLabel(r)} → ${r.to}（${r.rule}）</title></path>`;
  }));
  let bx="";
  boxes.forEach(b=>{ bx+=`<g style="${cc(SC(b.s))}"><rect class="sbox" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="10"/><text class="sname" x="${b.x+12}" y="${b.y+22}">${b.s}</text><text class="sja" x="${b.x+b.w-12}" y="${b.y+22}" text-anchor="end">${SCH_JA[b.s]}</text></g>`; });
  let tb="";
  DB.tables.forEach(t=>{ const p=pos[t.id]; const id=TID(t); const c=t.id===cur;
    tb+=`<g class="tnode${c?" cur":""}${cur&&!near.has(t.id)?" dim":""}" style="${cc(SC(t.schema))}" data-go="${id}" tabindex="0" role="link" aria-label="${t.id}" transform="translate(${p.x},${p.y})"><rect width="${p.w}" height="${p.h}" rx="6"/><text x="9" y="17">${t.name}</text>${t.name.length<16?`<text class="tja" x="${p.w-8}" y="17" text-anchor="end">${esc(t.ja.length>8?t.ja.slice(0,7)+"…":t.ja)}</text>`:""}</g>`; });
  return `<svg class="er" width="${width}" height="${height}" style="width:100%;min-width:760px;height:auto" viewBox="0 0 ${width} ${height}" role="img" aria-label="テーブルのつながり"><defs>
  <marker id="fk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker>
  <marker id="fkh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)"/></marker></defs>${bx}${lines}${tb}</svg>`;
}

document.getElementById("tabs").addEventListener("keydown",e=>{if(!["ArrowDown","ArrowUp"].includes(e.key))return;const ts=[...document.querySelectorAll(".tab")];const i=ts.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const n=ts[(i+(e.key==="ArrowDown"?1:-1)+ts.length)%ts.length];n.focus();location.hash=n.dataset.id;});
document.getElementById("main").addEventListener("click",e=>{
  const fb=e.target.closest("[data-flow]");
  if(fb){const i=+fb.dataset.flow;document.getElementById("awsbox").innerHTML=awsSVG(i<0?{}:{edges:FLOW_EDGES[i]});document.querySelectorAll(".fb").forEach(b=>b.classList.toggle("on",b===fb));return;}
  const g=e.target.closest("[data-go]");if(g)location.hash=g.dataset.go;});
document.getElementById("main").addEventListener("change",e=>{if(e.target.id==="common")document.getElementById("erbox").innerHTML=erSVG(null,e.target.checked);});
document.getElementById("main").addEventListener("keydown",e=>{const g=e.target.closest("[data-go]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();location.hash=g.dataset.go;}});
document.getElementById("q").addEventListener("input",e=>drawTabs(e.target.value));
document.getElementById("toggle").addEventListener("click",()=>{const r=document.getElementById("rail");const c=r.classList.toggle("closed");document.getElementById("toggle").setAttribute("aria-expanded",c?"false":"true");});
document.getElementById("cnt").textContent=`（${ALL.length-1}件）`;
window.addEventListener("hashchange",show);
drawTabs(""); show();
if(window.innerWidth<=820&&cur()!=="overview"){document.getElementById("rail").classList.add("closed");document.getElementById("toggle").setAttribute("aria-expanded","false");}
</script>
